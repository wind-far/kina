services:
  # 应用服务，同时承载前端与后端。
  app:
    image: couei/canana-vue:latest
    container_name: canana-vue-app
    restart: unless-stopped
    env_file:
      # 默认读取 .env.production，可通过 APP_ENV_FILE 覆盖
      - ${APP_ENV_FILE:-./.env.production}
    ports:
      # 默认仅发布到宿主机回环地址，由受管反向代理对外提供服务。
      - "${PUBLISH_HOST:-127.0.0.1}:${SERVER_PORT:-5409}:${SERVER_PORT:-5409}"
    volumes:
      # 持久化上传文件。
      - uploads_data:/app/uploads
#    extra_hosts:
#      # 仅当宿主机 PostgreSQL 明确允许容器网段访问时才使用该映射。
#      - "host.docker.internal:host-gateway"
    healthcheck:
      # 通过统一健康检查接口判断容器是否可用。
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.SERVER_PORT || 5409) + '/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# 定义持久化卷。
volumes:
  uploads_data:
