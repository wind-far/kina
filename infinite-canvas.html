<!doctype html>
<html lang="zh-CN" class="font-sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个无限画布创作工具" />
    <link rel="icon" href="data:," />
    <title>kina</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('infinite-canvas:theme_store') || '{}')
        var t = s.state && s.state.theme === 'dark' ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', t === 'dark')
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src-infinite-canvas/main.tsx"></script>
  </body>
</html>
